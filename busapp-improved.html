            cache: { ctbStopsDetail: {}, gmbStopsCoords: {} },

            // --- 地圖懶加載 ---
            async loadMapResources() {
                if (this.state.isMapLoaded || window.L) return Promise.resolve();
                if (this.state.isMapLoading) {
                    return new Promise((resolve, reject) => {
                        const checkInterval = setInterval(() => {
                            if (this.state.isMapLoaded || window.L) { clearInterval(checkInterval); resolve(); }
                            else if (!this.state.isMapLoading) { clearInterval(checkInterval); reject(new Error('地圖資源載入未完成')); }
                        }, 100);
                    });
                }
                this.state.isMapLoading = true;
                const providers = [
                    { js: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js', css: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css' },
                    { js: 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js', css: 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css' },
                    { js: 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js', css: 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' }
                ];
                const loadScript = (src) => new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    const timeout = setTimeout(() => { script.remove(); reject(new Error(`逾時：${src}`)); }, 10000);
                    script.src = src; script.async = true;
                    script.onload = () => { clearTimeout(timeout); resolve(); };
                    script.onerror = () => { clearTimeout(timeout); script.remove(); reject(new Error(`無法載入：${src}`)); };
                    document.head.appendChild(script);
                });
                let lastError;
                for (const provider of providers) {
                    try {
                        await loadScript(provider.js);
                        if (!window.L) throw new Error(`Leaflet 未初始化：${provider.js}`);
                        const link = document.createElement('link');
                        link.rel = 'stylesheet'; link.href = provider.css;
                        document.head.appendChild(link);
                        this.state.isMapLoaded = true;
                        this.state.isMapLoading = false;
                        return;
                    } catch (error) {
                        lastError = error;
                        console.warn('[map] Leaflet CDN unavailable, trying backup', error);
                    }
                }
                this.state.isMapLoading = false;
                throw lastError || new Error('無法載入地圖資源');
            },

            // --- PWA ---
            initPWA() {
                const iconUrl = 'https://img.vki.im/file/1777098379968_image_1777098374049.jpg';
                document.getElementById('apple-touch-icon').href = iconUrl;
                const manifest = {
                    "name": "巴士到站時間", "short_name": "巴士 ETA", "display": "standalone",
                    "background_color": "#f2f2f7", "theme_color": "#ffffff", "start_url": "./",
                    "icons": [{ "src": iconUrl, "sizes": "512x512", "type": "image/jpeg", "purpose": "any maskable" }]
                };
                const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
                document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);

                if ('serviceWorker' in navigator) {
                    window.addEventListener('load', () => {
                        const swCode = `
                            self.addEventListener('install', (e) => self.skipWaiting());
                            self.addEventListener('activate', (e) => e.waitUntil(clients.claim()));
                            self.addEventListener('fetch', (e) => {
                                if (e.request.url.includes('data.etabus.gov.hk') || e.request.url.includes('rt.data.gov.hk') || e.request.url.includes('data.etagmb.gov.hk')) return;
                                e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
                            });
                        `;
                        const swBlob = new Blob([swCode], { type: 'application/javascript' });
                        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
                    });
                }
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault(); this.state.deferredPrompt = e;
                    document.getElementById('install-btn').style.display = 'flex';
                });
            },
            updateHeaderClock() {
                const clock = document.getElementById('header-live-time');
                if (!clock) return;
                const now = new Date();
                const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Hong_Kong', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).formatToParts(now);
                const value = type => parts.find(part => part.type === type)?.value || '00';
                clock.textContent = `${value('hour')}:${value('minute')}:${value('second')}`;
                clock.dateTime = now.toISOString();
            },
            startHeaderClock() {
                if (this._headerClockTimer) clearInterval(this._headerClockTimer);
                this.updateHeaderClock();
                this._headerClockTimer = setInterval(() => this.updateHeaderClock(), 1000);
            },
            installPWA() {
                if (this.state.deferredPrompt) {
                    this.state.deferredPrompt.prompt();
                    this.state.deferredPrompt.userChoice.then((choiceResult) => {
                        if (choiceResult.outcome === 'accepted') document.getElementById('install-btn').style.display = 'none';
                        this.state.deferredPrompt = null;
                    });
                }
            },

            // --- API 快取與獲取 ---
            async fetchJSON(url, options = {}, timeout = 8000) {
                try {
                    const controller = new AbortController();
                    const id = setTimeout(() => controller.abort(), timeout);
                    const res = await fetch(url, { ...options, signal: controller.signal });
                    clearTimeout(id);
                    if (!res.ok) return null;
                    return await res.json();
                }
                catch(e) { return null; }
            },
            async fetchWithLocalCache(cacheKey, url, dataExtractor, ttl = 86400000 * 3) {
                try {
                    const cached = await IDB.getWithTTL(cacheKey, ttl);
                    if (cached) return cached;
                } catch(e) {}
                const res = await this.fetchJSON(url);
                if (res) {
                    const extractedData = dataExtractor(res);
                    try { await IDB.set(cacheKey, extractedData); } catch(e) {}
                    return extractedData;
                }
                try { const stale = await IDB.get(cacheKey); if (stale) return stale.data; } catch(e) {}
                return null;
            },
            async fetchWithRetry(url, maxRetries = 3) {
                let delay = 800;
                for (let i = 0; i < maxRetries; i++) {
                    const res = await this.fetchJSON(url);
                    if (res) return res;
                    await new Promise(r => setTimeout(r, delay));
                    delay *= 2;
                }
                return null;
            },

            getKMBRoutes() { return this.fetchWithLocalCache('CACHE_KMB_ROUTES', 'https://data.etabus.gov.hk/v1/transport/kmb/route/', res => res.data); },
            getCTBRoutes() { return this.fetchWithLocalCache('CACHE_CTB_ROUTES', 'https://rt.data.gov.hk/v2/transport/citybus/route/CTB', res => res.data); },
            getGMBRoutes() { return this.fetchWithLocalCache('CACHE_GMB_ROUTES_BASIC', 'https://data.etagmb.gov.hk/route', res => res.data.routes); },
            getNLBRoutes() { 
                return this.fetchWithLocalCache('CACHE_NLB_ROUTES', 'https://rt.data.gov.hk/v2/transport/nlb/route.php?action=list', res => {
                    return res.routes.map(r => {
                        let orig = r.routeName_c, dest = r.routeName_c;
                        if (r.routeName_c.includes('>')) { let pts = r.routeName_c.split('>'); orig = pts[0]; dest = pts[1]; } 
                        else if (r.routeName_c.includes('↺')) { let pts = r.routeName_c.split('↺'); orig = pts[0]; dest = "循環線 (" + pts[1] + ")"; }
                        return { ...r, orig_tc: orig, dest_tc: dest };
                    });
                });
            },
            getKMBStops() {
                return this.fetchWithLocalCache('CACHE_KMB_STOPS', 'https://data.etabus.gov.hk/v1/transport/kmb/stop', res => {
                    let dict = {}; res.data.forEach(s => { dict[s.stop] = { name: s.name_tc, lat: s.lat, lng: s.long }; });
                    return dict;
                });
            },
            getCTBAllStops() {
                return this.fetchWithLocalCache('CACHE_CTB_ALL_STOPS', 'https://rt.data.gov.hk/v2/transport/citybus/stop', res => res.data);
            },
            async getCTBStop(stopId) {
                if (this.cache.ctbStopsDetail[stopId]) return this.cache.ctbStopsDetail[stopId];
                let res = await this.fetchJSON(`https://rt.data.gov.hk/v2/transport/citybus/stop/${stopId}`);
                if (res && res.data) { this.cache.ctbStopsDetail[stopId] = res.data; return res.data; }
                return null;
            },

            // --- 解決小巴地圖沒有定位的函數 ---
            async getGMBStopCoords(stopId) {
                if (this.cache.gmbStopsCoords[stopId]) return this.cache.gmbStopsCoords[stopId];
                const slEntry = this.state.stopList?.[String(stopId)];
                if (slEntry?.location?.lat) {
                    const coords = { lat: slEntry.location.lat, lng: slEntry.location.lng };
                    this.cache.gmbStopsCoords[stopId] = coords; return coords;
                }
                try { const cached = await IDB.getWithTTL(`gmb_stop_${stopId}`, 86400000*7); if (cached) { this.cache.gmbStopsCoords[stopId] = cached; return cached; } } catch(e) {}
                try {
                    const controller = new AbortController(); const id = setTimeout(() => controller.abort(), 3000); 
                    const response = await fetch(`https://data.etagmb.gov.hk/stop/${stopId}`, { signal: controller.signal });
                    clearTimeout(id); if(!response.ok) return null;
                    const stopDetail = await response.json();
                    if (stopDetail && stopDetail.data && stopDetail.data.coordinates && stopDetail.data.coordinates.wgs84) {
                        const wgs = stopDetail.data.coordinates.wgs84;
                        const coords = { lat: wgs.latitude || wgs.lat, lng: wgs.longitude || wgs.long };
                        this.cache.gmbStopsCoords[stopId] = coords;
                        try { await IDB.set(`gmb_stop_${stopId}`, coords); } catch(e) {}
                        return coords;
                    }
                } catch(e) {} return null;
            },

            getDatabaseRouteStops(routeObj, operator) {
                operator = this.normalizeOperator(operator);
                const routeList = this.state.routeList || {};
                const desiredDestination = routeObj.destinations || routeObj.dest || '';
                let routeEntry = routeObj.routeKey ? routeList[routeObj.routeKey] : null;
                if (!routeEntry || !routeEntry.co?.includes(operator)) {
                    routeEntry = Object.values(routeList).find(entry =>
                        entry.route === routeObj.route && entry.co?.includes(operator) &&
                        (!desiredDestination || entry.dest?.zh === desiredDestination || entry.dest?.en === desiredDestination)
                    ) || Object.values(routeList).find(entry => entry.route === routeObj.route && entry.co?.includes(operator));
                }
                const targetStopId = operator === 'lightRail'
                    ? (routeObj.lightRail_stop || routeObj.lrt_stop || routeObj.lightrail_stop)
                    : (routeObj.lrtfeeder_stop || routeObj.irtfeeder_stop || routeObj.mtrfeeder_stop || routeObj.mtrbus_stop);
                const stopIds = routeEntry?.stops?.[operator] || (targetStopId ? [targetStopId] : []);
                return stopIds.map((id, index) => {
                    const stop = this.state.stopList?.[id] || {};
                    return {
                        id,
                        name: stop.name?.zh || stop.name?.en || '未知車站',
                        lat: stop.location?.lat ?? stop.lat ?? null,
                        lng: stop.location?.lng ?? stop.lng ?? null,
                        seq: index + 1,
                    };
                });
            },
            hydrateMtrFavourite(route, operator) {
                operator = this.normalizeOperator(operator);
                if (!['lightRail', 'lrtfeeder'].includes(operator) || !this.state.routeList || !this.state.stopList) return route;
                const desiredDestination = route.destinations || route.dest || '';
                let routeEntry = route.routeKey ? this.state.routeList[route.routeKey] : null;
                if (!routeEntry || !routeEntry.co?.includes(operator)) {
                    routeEntry = Object.entries(this.state.routeList).find(([, entry]) =>
                        entry.route === route.route && entry.co?.includes(operator) &&
                        (!desiredDestination || entry.dest?.zh === desiredDestination || entry.dest?.en === desiredDestination)
                    )?.[1] || Object.entries(this.state.routeList).find(([, entry]) =>
                        entry.route === route.route && entry.co?.includes(operator)
                    )?.[1];
                }
                if (!routeEntry) return route;
                const stopIds = routeEntry.stops?.[operator] || [];
                const legacyStopId = operator === 'lightRail'
                    ? (route.lightRail_stop || route.lightRail_stopId || route.lrt_stop || route.lightrail_stop || route.stopId || route.stop)
                    : (route.lrtfeeder_stop || route.lrtfeeder_stopId || route.irtfeeder_stop || route.mtrfeeder_stop || route.mtrbus_stop || route.stopId || route.stop);
                const stopId = stopIds.includes(legacyStopId)
                    ? legacyStopId
                    : stopIds.find(id => {
                        const stop = this.state.stopList[id];
                        return stop?.name?.zh === route.stopName || stop?.name?.en === route.stopName;
                    }) || legacyStopId;
                const routeKey = Object.entries(this.state.routeList).find(([, entry]) => entry === routeEntry)?.[0];
                route.routeKey = route.routeKey || routeKey;
                route.destinations = route.destinations || routeEntry.dest?.zh || routeEntry.dest?.en || '';
                route.operators = [operator];
                if (operator === 'lightRail' && stopId) route.lightRail_stop = stopId;
                if (operator === 'lrtfeeder' && stopId) route.lrtfeeder_stop = stopId;
                return route;
            },
            async resolveNlbRouteId(route) {
                const existingId = route.nlb_routeId || route.nlbId;
                if (existingId) {
                    route.nlb_routeId = String(existingId);
                    return route.nlb_routeId;
                }
                const normalise = value => String(value || '').replace(/[\s（）()]/g, '');
                const desiredDestination = normalise(route.destinations || route.dest);
                const desiredOrigin = normalise(route.origins || route.orig);
                const candidates = (await this.getNLBRoutes() || []).filter(item => String(item.routeNo) === String(route.route));
                const matched = candidates.find(item =>
                    (!desiredDestination || normalise(item.dest_tc).includes(desiredDestination)) &&
                    (!desiredOrigin || normalise(item.orig_tc).includes(desiredOrigin))
                ) || candidates.find(item => !desiredDestination || normalise(item.dest_tc).includes(desiredDestination)) || candidates[0];
                if (matched?.routeId) route.nlb_routeId = String(matched.routeId);
                return route.nlb_routeId || null;
            },
            async resolveNlbEtaRouteId(route) {
                const routeId = await this.resolveNlbRouteId(route);
                if (!routeId) return null;
                const normalise = value => String(value || '').replace(/[\s（）()]/g, '');
                const desiredDestination = normalise(route.destinations || route.dest);
                const candidates = (await this.getNLBRoutes() || []).filter(item => String(item.routeNo) === String(route.route));
                const selectedRoute = candidates.find(item => String(item.routeId) === String(routeId));
                const selectedOrigin = selectedRoute?.orig_tc || route.origins || route.orig || '';
                const isOriginVariant = /[（(]/.test(selectedOrigin);
                const baseOrigin = normalise(String(selectedOrigin).split(/[（(]/)[0]);
                const baseRoute = candidates.find(item =>
                    (!desiredDestination || normalise(item.dest_tc).includes(desiredDestination)) &&
                    normalise(item.orig_tc) === baseOrigin
                );
                return isOriginVariant && baseRoute?.routeId ? String(baseRoute.routeId) : String(routeId);
            },

            // =======================================================================
            // 🌟 史詩級升級：背景同步全港小巴路線 + 「所有途經站」資料引擎
            // =======================================================================
            async loadHKBusData() {
                if (this.state.isDataReady) return;
                const GIST_URL = 'https://cdn.jsdelivr.net/gh/hkbus/hk-bus-crawling@gh-pages/routeFareList.min.json';
                const dbStatus = document.getElementById('db-status');
                const syncEl   = document.getElementById('sync-status');

                // 1. Try IDB cache first
                try {
                    const [cachedRoutes, cachedStops] = await Promise.all([
                        IDB.getWithTTL('CACHE_HKBUS_ROUTES_V4', 86400000 * 7),
                        IDB.getWithTTL('CACHE_HKBUS_STOPS_V4',  86400000 * 7)
                    ]);
                    if (cachedRoutes) {
                        this.state.routeList   = cachedRoutes;
                        this.state.stopList    = cachedStops || null;
                        this.state.isDataReady = true;
                        console.log('hkbus data loaded from IDB ✅');
                        if (dbStatus) dbStatus.textContent = `✅ ${Object.keys(cachedRoutes).length} 條路線已就緒`;
                        const inp = document.getElementById('route-input');
                        if (inp && inp.value.trim()) this.performSearch();
                        return;
                    }
                } catch(e) { console.warn('IDB read error:', e); }

                // 2. No cache - auto fetch from Gist
                if (!GIST_URL || GIST_URL === 'YOUR_GIST_RAW_URL_HERE') return;
                try {
                    if (syncEl) { syncEl.style.display = 'block'; syncEl.innerText = '🌐 正在下載路線資料庫...'; }
                    if (dbStatus) dbStatus.textContent = '🌐 下載中...';
                    console.log('Fetching routeFareList from Gist...');
                    const res = await fetch(GIST_URL);
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    if (syncEl) syncEl.innerText = '📦 正在解析資料...';
                    const json = await res.json();
                    const routeData = json.routeList || json;
                    const stopData  = json.stopList  || null;
                    if (!routeData || Object.keys(routeData).length < 10) throw new Error('Invalid data');
                    await IDB.set('CACHE_HKBUS_ROUTES_V4', routeData);
                    if (stopData) await IDB.set('CACHE_HKBUS_STOPS_V4', stopData);
                    this.state.routeList   = routeData;
                    this.state.stopList    = stopData;
                    this.state.isDataReady = true;
                    const count = Object.keys(routeData).length;
                    if (dbStatus) dbStatus.textContent = `✅ ${count} 條路線已就緒`;
                    if (syncEl) { syncEl.innerText = `✅ 下載完成！${count} 條路線`; setTimeout(()=>{ syncEl.style.display='none'; }, 3000); }
                    console.log('routeFareList loaded from Gist ✅', count, 'routes');
                    const inp = document.getElementById('route-input');
                    if (inp && inp.value.trim()) this.performSearch();
                } catch(e) {
                    console.error('Gist fetch failed:', e);
                    if (dbStatus) dbStatus.textContent = '⚠️ 下載失敗，請手動匯入';
                    if (syncEl) { syncEl.innerText = '⚠️ 下載失敗：' + e.message; setTimeout(()=>{ syncEl.style.display='none'; }, 4000); }
                }
            },

            async importHKBusDB(event) {
                const file = event.target.files[0];
                if (!file) return;
                const syncEl = document.getElementById('sync-status');
                if (syncEl) { syncEl.style.display = 'block'; syncEl.innerText = '📂 正在讀取檔案，請稍候...'; }
                try {
                    const txt = await file.text();
                    if (syncEl) syncEl.innerText = '📂 正在解析 JSON...';
                    const json = JSON.parse(txt);
                    // routeFareList schema: { routeList: {...}, stopList: {...} } or flat object
                    const routeData = json.routeList || json;
                    const stopData  = json.stopList  || null;
                    if (!routeData || typeof routeData !== 'object' || Object.keys(routeData).length < 10) {
                        alert('❌ 無法識別檔案格式，請確認選擇 routeFareList.min.json');
                        if (syncEl) syncEl.style.display = 'none';
                        return;
                    }
                    if (syncEl) syncEl.innerText = '💾 正在存入本機資料庫...';
                    await IDB.set('CACHE_HKBUS_ROUTES_V4', routeData);
                    if (stopData) await IDB.set('CACHE_HKBUS_STOPS_V4', stopData);
                    this.state.routeList   = routeData;
                    this.state.stopList    = stopData;
                    this.state.isDataReady = true;
                    const routeCount = Object.keys(routeData).length;
                    const stopCount  = stopData ? Object.keys(stopData).length : 0;
                    if (syncEl) { syncEl.innerText = `✅ 匯入成功！${routeCount} 條路線`; setTimeout(()=>{ if(syncEl) syncEl.style.display='none'; }, 3000); }
                    const dbStatus = document.getElementById('db-status');
                    if (dbStatus) dbStatus.textContent = `✅ ${routeCount} 條路線已就緒`;
                    const inp = document.getElementById('route-input');
                    if (inp && inp.value.trim()) this.performSearch();
                    alert(`✅ 資料庫匯入成功！\n路線數：${routeCount}${stopCount ? '\n站點數：'+stopCount : ''}\n\n之後搜尋將自動使用本機資料庫。`);
                } catch(e) {
                    alert('❌ 匯入失敗：' + e.message + '\n\n請確認選擇正確的 routeFareList.min.json 檔案。');
                    if (syncEl) syncEl.style.display = 'none';
                }
                event.target.value = '';
            },

            async initBackgroundSync() {
                if (this.state.isGMBSyncing) return;
                
                this.getKMBRoutes(); this.getCTBRoutes(); this.getNLBRoutes();
                
                const gmbCacheKey = 'CACHE_GMB_ALL_DETAILS_V6'; // 升級快取版本
                try {
                    const cachedGmb = await IDB.getWithTTL(gmbCacheKey, 86400000 * 7);
                    if (cachedGmb) { this.state.gmbAllRoutes = cachedGmb; return; }
                } catch(e) {}
                if (false) {  // replaced by IDB above
                    try {
                        const parsed = {};
                        if (false) { 
                            this.state.gmbAllRoutes = parsed.data;
                            return; 
                        }
                    } catch(e){}
                }

                this.state.isGMBSyncing = true;
                const syncEl = document.getElementById('sync-status');
                if(syncEl) syncEl.style.display = 'block';

                try {
                    const routeList = await this.getGMBRoutes();
                    let allCodes = [];
                    ['HKI', 'KLN', 'NT'].forEach(region => {
                        if (routeList && routeList[region]) {
                            routeList[region].forEach(code => allCodes.push({region, code}));
                        }
                    });
                    
                    let detailedRoutes = [];
                    // 階段 1：獲取路線基本資料
                    if(syncEl) syncEl.innerText = '🔄 正在獲取小巴路線資料 (1/2)...';
                    for (let i = 0; i < allCodes.length; i += 40) {
                        const chunk = allCodes.slice(i, i + 40);
                        const responses = await Promise.all(chunk.map(req => 
                            this.fetchJSON(`https://data.etagmb.gov.hk/route/${req.region}/${req.code}`)
                        ));
                        responses.forEach((res, _ri) => {
                            const _reqCode = chunk[_ri]?.code;
                            if (res && res.data) {
                                res.data.forEach(routeData => {
                                    routeData.directions.forEach(dir => {
                                        detailedRoutes.push({
                                            operator: 'gmb', route: String(_reqCode || routeData.route_code), gmb_routeId: routeData.route_id, 
                                            gmb_routeSeq: dir.route_seq, orig: dir.orig_tc, dest: dir.dest_tc, opName: '專線小巴',
                                            stops_str: '' // 準備存放所有途經站
                                        });
                                    });
                                });
                            }
                        });
                    }

                    // 階段 2：深層獲取每條路線的「所有途經站」，解決地點搜不到途經小巴的問題
                    if(syncEl) syncEl.innerText = '🔄 正在建立全港小巴車站索引庫，約需 15 秒 (2/2)...';
                    for (let i = 0; i < detailedRoutes.length; i += 30) {
                        const chunk = detailedRoutes.slice(i, i + 30);
                        const stopResponses = await Promise.all(chunk.map(route =>
                            this.fetchJSON(`https://data.etagmb.gov.hk/route-stop/${route.gmb_routeId}/${route.gmb_routeSeq}`)
                        ));

                        stopResponses.forEach((res, idx) => {
                            if (res && res.data && res.data.route_stops) {
                                // 將所有站名組合成一個字串，用於瞬間關鍵字比對
                                chunk[idx].stops_str = res.data.route_stops.map(s => s.name_tc).join('|');
                            }
                        });

                        // 漸進式寫入狀態，讓使用者若正在搜尋可以立刻看到新結果
                        this.state.gmbAllRoutes = [...detailedRoutes];
                        if (document.getElementById('route-input') && document.getElementById('route-input').value.trim() !== '') {
                            this.performSearch(); 
                        }
                        
                        // 稍微停頓避免被伺服器封鎖 (Rate Limit)
                        await new Promise(r => setTimeout(r, 200));
                    }
                    
                    await IDB.set(gmbCacheKey, detailedRoutes);
                    if(syncEl) syncEl.innerText = '✅ 小巴資料同步完成！';
                    setTimeout(() => { if(syncEl) syncEl.style.display = 'none'; }, 3000);
                } catch (e) {
                    if(syncEl) syncEl.style.display = 'none';
                } finally {
                    this.state.isGMBSyncing = false;
                }
            },

            // --- 基礎分頁 ---
            switchTab(tabId) {
                if (this.state.isEditMode && tabId !== 'favourites') this.toggleEditMode(); 
                this.state.currentTab = tabId;
                document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
                document.getElementById(`view-${tabId}`).classList.add('active');
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                document.getElementById(`nav-${tabId}`).classList.add('active');
                const editBtn = document.getElementById('edit-btn');
                const refreshBtn = document.getElementById('refresh-btn');

                if (tabId === 'favourites') {
                    headerText.textContent = '⭐ 收藏路線';
                    editBtn.style.display = 'flex'; refreshBtn.style.display = 'flex';
                    this.manualRefresh();
                } else if (tabId === 'planner') {
                    headerText.textContent = '規劃';
                    editBtn.style.display = 'none'; refreshBtn.style.display = 'none';
                    setTimeout(() => this.loadHKBusData(), 300);

                } else if (tabId === 'routes') {
                    headerText.textContent = '🔍 路線搜尋';
                    editBtn.style.display = 'none'; refreshBtn.style.display = 'none';
                    
                    this.loadHKBusData();
                    this.initBackgroundSync();
                    // 同時把車站庫加載好，以備等下由站查路線的逆向反查功能使用
                    this.getKMBStops(); this.getCTBAllStops(); 
                    
                    if(window.innerWidth > 600) document.getElementById('route-input').focus();
                }
            },

            loadData() {
                const v3Saved = localStorage.getItem('myBusRoutes_v3');
                if (v3Saved) { try { this.state.savedRoutes = JSON.parse(v3Saved); return; } catch (e) {} }
                this.state.savedRoutes = [];
            },
            saveData(triggerRefresh = true) {
                localStorage.setItem('myBusRoutes_v3', JSON.stringify(this.state.savedRoutes));
                if(triggerRefresh && this.state.currentTab === 'favourites') this.manualRefresh();
            },
            async clearCache() {
                if (!confirm("確定要清除所有巴士路線及車站快取嗎？\n（您的收藏將會保留）")) return;
                try {
                    const db = await IDB.open();
                    await new Promise(resolve => {
                        const tx = db.transaction(IDB.STORE, 'readwrite');
                        tx.objectStore(IDB.STORE).clear();
                        tx.oncomplete = resolve; tx.onerror = resolve;
                    });
                    for (let i = localStorage.length - 1; i >= 0; i--) {
                        const k = localStorage.key(i);
                        if (k !== 'myBusRoutes_v3') localStorage.removeItem(k);
                    }
                    alert("✅ 快取已清除！"); location.reload();
                } catch(e) { alert("❌ 清除失敗：" + e.message); }
            },
            exportData() {
                try {
                    if (!this.state.savedRoutes || this.state.savedRoutes.length === 0) { alert("目前沒有路線可以備份喔！"); return; }
                    const jsonStr = JSON.stringify(this.state.savedRoutes, null, 2);
                    const blob = new Blob([jsonStr], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const dlNode = document.createElement('a');
                    dlNode.href = url; dlNode.download = "bus_routes_backup.json";
                    document.body.appendChild(dlNode);
                    dlNode.click();
                    setTimeout(() => { dlNode.remove(); URL.revokeObjectURL(url); }, 100);
                    alert(`✅ 已匯出 ${this.state.savedRoutes.length} 條路線！`);
                } catch (err) {
                    alert("❌ 匯出失敗：" + err.message);
                }
            },
            importData(event) {
                const file = event.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onerror = () => alert("❌ 讀取檔案失敗，請重試。");
                reader.onload = (e) => {
                    try {
                        const importedData = JSON.parse(e.target.result);
                        if (Array.isArray(importedData)) { this.state.savedRoutes = importedData; this.saveData(true); alert(`✅ 已匯入 ${importedData.length} 條路線！`); }
                        else { alert("❌ 檔案格式不正確，請選擇正確的備份檔案。"); }
                    } catch (err) { alert("❌ 讀取檔案失敗：" + err.message); }
                };
                reader.readAsText(file); event.target.value = ''; 
            },

            // --- ETA 邏輯 ---
            getMinutesDiff(etaString) {
                if (!etaString) return null;
                const safeEtaStr = etaString.replace(' ', 'T');
                return Math.round((new Date(safeEtaStr).getTime() - new Date().getTime()) / 60000);
            },
            formatETAs(etaArray) {
                return etaArray.map(item => ({ min: this.getMinutesDiff(item.eta) }))
                               .filter(item => item.min !== null && item.min >= 0).slice(0, 2);
            },
            getPrimaryColor(operator) {
                operator = this.normalizeOperator(operator);
                if (operator === 'ctb') return '#fccc0a';
                if (operator === 'nlb') return '#0072c6';
                if (operator === 'gmb') return '#008f4c';
                if (operator === 'lightRail') return '#ffffff';
                if (operator === 'lrtfeeder') return '#f57c00';
                return '#ce3043'; 
            },
            normalizeOperator(operator) {
                const raw = String(operator || '').trim();
                const key = raw.toLowerCase().replace(/[\s_-]/g, '');
                if (['lightrail', 'lrt'].includes(key)) return 'lightRail';
                if (['lrtfeeder', 'irtfeeder', 'mtrfeeder', 'mtrbus'].includes(key)) return 'lrtfeeder';
                return raw;
            },

            renderETAInContainer(etaArray, elementId, operatorClass = 'arriving-kmb') {
                const el = document.getElementById(elementId);
                if (!el) return;
                if (etaArray === null) { el.innerHTML = '<span style="color:#aaa; font-size:12px;">載入失敗</span>'; return; }
                let etas = this.formatETAs(etaArray.map(eta => ({eta}))); 
                if (etas.length === 0) { el.innerHTML = '<span style="color:#aaa; font-size:12px;">暫無班次</span>'; return; }
                let html = '';
                etas.forEach((eta, i) => {
                    let text = eta.min === 0 ? `<span class="${operatorClass}">就到</span>` : `<strong>${eta.min}</strong>`;
                    html += i === 0 ? `<span class="eta-row eta-primary">${text}</span>` : `<span class="eta-row eta-secondary" style="margin-left:6px;"><strong>${eta.min}</strong></span>`;
                });
                el.innerHTML = html;
            },

            async loadAllETAsForList(stops, routeObj, containerPrefix) {
                let operator = this.normalizeOperator(routeObj.operator || (Array.isArray(routeObj.operators) ? routeObj.operators[0] : routeObj.operators));
                let route = routeObj.route; let opColorClass = `arriving-${operator}`;
                
                stops.forEach(s => {
                    const el = document.getElementById(`${containerPrefix}${s.seq}`);
                    if (el) el.innerHTML = '<span style="color:#888; font-size:12px;">載入中...</span>';
                });

                if (operator === 'kmb') {
                    let apiDir = (routeObj.dir === 'I' || routeObj.kmb_dir === 'I') ? 'I' : 'O';
                    try {
                        let res = await this.fetchJSON(`https://data.etabus.gov.hk/v1/transport/kmb/route-eta/${route}/1`);
                        let etasBySeq = {};
                        if(res && res.data) {
                            res.data.filter(b => b.dir === apiDir).forEach(b => {
                                if (!etasBySeq[b.seq]) etasBySeq[b.seq] = [];
                                if (b.eta) etasBySeq[b.seq].push(b.eta);
                            });
                        }
                        stops.forEach(s => this.renderETAInContainer(etasBySeq[s.seq] || [], `${containerPrefix}${s.seq}`, opColorClass));
                    } catch (e) { stops.forEach(s => this.renderETAInContainer(null, `${containerPrefix}${s.seq}`)); }
                } else if (operator === 'ctb') {
                    let apiDir = (routeObj.dir === 'inbound' || routeObj.ctb_dir === 'inbound' || routeObj.dir === 'I') ? 'I' : 'O';
                    const chunkArray = (arr, size) => Array.from({ length: Math.ceil(arr.length / size) }, (v, i) => arr.slice(i * size, i * size + size));
                    for (let chunk of chunkArray(stops, 10)) {
                        await Promise.all(chunk.map(async (s) => {
                            try {
                                let res = await this.fetchJSON(`https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${s.id}/${route}`);
                                let etas = [];
                                if(res && res.data) {
                                    res.data.filter(b => b.dir === apiDir).forEach(b => { if (b.eta && !(b.rmk_tc || '').includes('九巴時段')) etas.push(b.eta); });
                                }
                                this.renderETAInContainer(etas, `${containerPrefix}${s.seq}`, opColorClass);
                            } catch(e) { this.renderETAInContainer(null, `${containerPrefix}${s.seq}`); }
                        }));
                    }
                } else if (operator === 'nlb') {
                    const nlbRouteId = await this.resolveNlbEtaRouteId(routeObj);
                    if (!nlbRouteId) {
                        stops.forEach(s => this.renderETAInContainer(null, `${containerPrefix}${s.seq}`, opColorClass));
                        return;
                    }
                    await Promise.all(stops.map(async (s) => {
                        try {
                            const request = () => this.fetchJSON(`https://rt.data.gov.hk/v2/transport/nlb/stop.php?action=estimatedArrivals&routeId=${nlbRouteId}&stopId=${s.id}`);
                            let res = await request();
                            if (!res) {
                                await new Promise(resolve => setTimeout(resolve, 280));
                                res = await request();
                            }
                            const etas = (res?.estimatedArrivals || []).map(item => item.estimatedArrivalTime).filter(Boolean);
                            this.renderETAInContainer(etas, `${containerPrefix}${s.seq}`, opColorClass);
                        } catch(e) { this.renderETAInContainer(null, `${containerPrefix}${s.seq}`, opColorClass); }
                    }));
                } else if (operator === 'gmb') {
                    if (!routeObj.gmb_routeId) {
                        if (this.state.gmbAllRoutes?.length) {
                            const _gm = this.state.gmbAllRoutes.find(g => String(g.route) === String(routeObj.route) && (routeObj.dest ? g.dest.includes(routeObj.dest?.slice(0,4)) : true))
                                     || this.state.gmbAllRoutes.find(g => String(g.route) === String(routeObj.route));
                            if (_gm) { routeObj.gmb_routeId = _gm.gmb_routeId; routeObj.gmb_routeSeq = _gm.gmb_routeSeq; }
                        }
                        if (!routeObj.gmb_routeId) {
                            for (const _region of ['HKI','KLN','NT']) {
                                const _rd = await this.fetchJSON(`https://data.etagmb.gov.hk/route/${_region}/${routeObj.route}`);
                                if (_rd?.data?.length) {
                                    const _m = _rd.data[0].directions.find(d => routeObj.dest && d.dest_tc.includes(routeObj.dest.slice(0,4))) || _rd.data[0].directions[0];
                                    routeObj.gmb_routeId = _rd.data[0].route_id; routeObj.gmb_routeSeq = _m?.route_seq || 1; break;
                                }
                            }
                        }
                    }
                    const chunkArray = (arr, size) => Array.from({ length: Math.ceil(arr.length / size) }, (v, i) => arr.slice(i * size, i * size + size));
                    for (let chunk of chunkArray(stops, 3)) { 
                        await Promise.all(chunk.map(async (s) => {
                            try {
                                let _gRid = routeObj.gmb_routeId;
                                if (!_gRid) { for (const _r of ['HKI','KLN','NT']) { const _d = await this.fetchJSON(`https://data.etagmb.gov.hk/route/${_r}/${routeObj.route}`); if (_d?.data?.length) { _gRid = _d.data[0].route_id; const _m = _d.data[0].directions.find(d => routeObj.dest && d.dest_tc.includes(routeObj.dest.slice(0,4))) || _d.data[0].directions[0]; routeObj.gmb_routeId = _gRid; routeObj.gmb_routeSeq = _m?.route_seq || 1; break; } } }
                                if (!_gRid) { this.renderETAInContainer(null, `${containerPrefix}${s.seq}`, opColorClass); return; }
                                let res = await this.fetchJSON(`https://data.etagmb.gov.hk/eta/route-stop/${_gRid}/${s.id}`);
                                let etas = [];
                                if(res && res.data) {
                                    let routeData = res.data.find(d => String(d.route_seq) === String(routeObj.gmb_routeSeq));
                                    if(routeData && routeData.eta) { etas = routeData.eta.filter(e => e.timestamp).map(e => e.timestamp); }
                                }
                                this.renderETAInContainer(etas, `${containerPrefix}${s.seq}`, opColorClass);
                            } catch(e) { this.renderETAInContainer(null, `${containerPrefix}${s.seq}`); }
                        }));
                    }
                } else if (operator === 'lightRail') {
                    const destination = routeObj.dest || routeObj.destinations || '';
                    const fetchStationEtas = async (s) => {
                        try {
                            const stationId = String(s.id || s.stopId || '').replace(/^LR/i, '');
                            const extractEtas = (res) => {
                                const values = [];
                                (res?.platform_list || []).forEach(platform => (platform.route_list || [])
                                    .filter(item => (String(item.route_no) === String(route) || String(item.additionalInfo1) === String(route)) && (!destination || item.dest_ch === destination || String(item.dest_en || '').includes('Circular')) && Number(item.stop) === 0)
                                    .forEach(item => {
                                        const minutes = Number.parseInt(item.time_en, 10);
                                        const seconds = Number.isFinite(minutes) ? minutes * 60 : 0;
                                        values.push(new Date(Date.now() + seconds * 1000).toISOString());
                                    }));
                                return values;
                            };
                            let res = await this.fetchJSON(`https://rt.data.gov.hk/v1/transport/mtr/lrt/getSchedule?station_id=${stationId}&with_special=1`);
                            let etas = extractEtas(res);
                            if (etas.length === 0) {
                                await new Promise(resolve => setTimeout(resolve, 280));
                                res = await this.fetchJSON(`https://rt.data.gov.hk/v1/transport/mtr/lrt/getSchedule?station_id=${stationId}&with_special=1`);
                                etas = extractEtas(res);
                            }
                            this.renderETAInContainer(etas, `${containerPrefix}${s.seq}`, opColorClass);
                        } catch (e) { this.renderETAInContainer(null, `${containerPrefix}${s.seq}`, opColorClass); }
                    };
                    await Promise.all(stops.map(fetchStationEtas));
                } else if (operator === 'lrtfeeder') {
                    try {
                        const scheduleRequest = () => this.fetchJSON('https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule', {
                            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ language: 'zh', routeName: String(route) })
                        });
                        const extractEtas = (res, stop) => ((res?.busStop || []).find(item => item.busStopId === (stop.id || stop.stopId))?.bus || []).map(bus => {
                            const rawSeconds = String(bus.arrivalTimeInSecond) === '108000' ? bus.departureTimeInSecond : bus.arrivalTimeInSecond;
                            const seconds = Number(rawSeconds || 0);
                            return Number.isFinite(seconds) ? new Date(Date.now() + seconds * 1000).toISOString() : null;
                        }).filter(Boolean);
                        let res = await scheduleRequest();
                        let needsRetry = stops.every(s => extractEtas(res, s).length === 0);
                        if (needsRetry) {
                            await new Promise(resolve => setTimeout(resolve, 280));
                            res = await scheduleRequest();
                        }
                        stops.forEach(s => {
                            const etas = extractEtas(res, s);
                            this.renderETAInContainer(etas, `${containerPrefix}${s.seq}`, opColorClass);
                        });
                    } catch (e) { stops.forEach(s => this.renderETAInContainer(null, `${containerPrefix}${s.seq}`, opColorClass)); }
                } else {
                    stops.forEach(s => this.renderETAInContainer([], `${containerPrefix}${s.seq}`, opColorClass));
                }
            },

            // --- 即時智能搜尋引擎 (整合反查途經路線邏輯) ---

            getFareColor(operator) {
                const op = (operator || '').toLowerCase();
                if (op === 'kmb') return '#ff3b30';
                if (op === 'ctb') return '#ff9500';
                if (op === 'nlb') return '#007aff';
                if (op === 'gmb') return '#34c759';
                if (op === 'lightrail') return '#1b2b34';
                if (op === 'lrtfeeder') return '#f57c00';
                return '#3a3a3c';
            },

            plannerUseGPS() {
                const btn = document.getElementById('planner-gps-btn');
                const inp = document.getElementById('planner-origin');
                if (btn) btn.style.color = '#ff9500';
                if (!navigator.geolocation) { alert('此裝置不支援定位'); return; }
                navigator.geolocation.getCurrentPosition(async pos => {
                    const { latitude: lat, longitude: lng } = pos.coords;
                    const stopList = this.state.stopList || {};
                    const toRad = d => d * Math.PI / 180;
                    const haversine = (a,b,c,d) => { const R=6371000,dL=toRad(c-a),dl=toRad(d-b),x=Math.sin(dL/2)**2+Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(dl/2)**2; return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)); };
                    let nearest = null, minDist = Infinity;
                    Object.values(stopList).forEach(s => {
                        const slat = s.location?.lat ?? s.lat, slng = s.location?.lng ?? s.lng;
                        if (!slat || !slng) return;
                        const d = haversine(lat, lng, parseFloat(slat), parseFloat(slng));
                        if (d < minDist) { minDist = d; nearest = s; }
                    });
                    if (nearest?.name?.zh) inp.value = nearest.name.zh;
                    if (btn) btn.style.color = '#34c759';
                    this.debounceplannerSearch();
                }, () => { if (btn) btn.style.color = '#007AFF'; alert('定位失敗，請手動輸入'); },
                { enableHighAccuracy: true, timeout: 8000 });
            },

            debounceplannerSearch() {
                clearTimeout(this._plannerTimeout);
                this._plannerTimeout = setTimeout(() => {
                    const o = document.getElementById('planner-origin')?.value.trim();
                    const d = document.getElementById('planner-dest')?.value.trim();
                    if (o && d && o.length >= 2 && d.length >= 2) this.runPlannerSearch();
                }, 800);
            },

            runPlannerSearch() {
                const originKw = (document.getElementById('planner-origin')?.value || '').trim();
                const destKw   = (document.getElementById('planner-dest')?.value || '').trim();
                const resultsEl = document.getElementById('planner-results');
                if (!originKw || !destKw || originKw.length < 2 || destKw.length < 2) return;
                if (!this.state.isDataReady || !this.state.routeList) {
                    resultsEl.innerHTML = '<div class="status-message">⚠️ 資料庫載入中，請稍候...</div>';
                    return;
                }
                if (this._plannerSearchTimer) clearTimeout(this._plannerSearchTimer);
                resultsEl.innerHTML = '<div class="status-message">🔍 正在搜尋...</div>';
                this._plannerSearchTimer = setTimeout(() => this._execPlannerSearch(originKw, destKw, resultsEl), 30);
            },

            _execPlannerSearch(originKw, destKw, resultsEl) {

                const norm = s => String(s||'').toLowerCase().replace(/\s+/g,'');
                const okw = norm(originKw), dkw = norm(destKw);
                const CO_NAME = { kmb:'九巴', ctb:'城巴', nlb:'大嶼山巴士', gmb:'專線小巴', lightRail:'輕鐵', lrtfeeder:'港鐵巴士', mtr:'港鐵', lrt:'輕鐵' };
                const fareColors = { kmb:'#ce3043', ctb:'#f4c400', nlb:'#0072c6', gmb:'#008f4c', lightRail:'#1b2b34', lrtfeeder:'#f57c00' };
                const bgClass = { kmb:'bg-kmb', ctb:'bg-ctb', nlb:'bg-nlb', gmb:'bg-gmb', lightRail:'bg-lightRail', lrtfeeder:'bg-lrtfeeder' };
                const stopList = this.state.stopList || {};
                const results = [];

                Object.entries(this.state.routeList).forEach(([rid, r]) => {
                    if (!r?.co?.length) return;
                    if (r.co.includes('kmb') && r.serviceType && r.serviceType !== '1') return;
                    const co = r.co[0];
                    const stopIds = r.stops?.[co] || Object.values(r.stops||{})[0] || [];
                    if (stopIds.length < 2) return;

                    let origIdx = -1, destIdx = -1;
                    for (let _i = 0; _i < stopIds.length; _i++) {
                        const sn = norm(stopList?.[stopIds[_i]]?.name?.zh || stopList?.[stopIds[_i]]?.name?.en || '');
                        if (origIdx < 0 && sn.includes(okw)) origIdx = _i;
                        if (sn.includes(dkw)) destIdx = _i;
                        if (origIdx >= 0 && destIdx > origIdx) break;
                    }

                    const origZh = norm(r.orig?.zh||''), destZh = norm(r.dest?.zh||'');
                    const hasStopList = Object.keys(stopList).length > 0;
                    if (!hasStopList) {
                        if (origIdx < 0 && origZh.includes(okw)) origIdx = 0;
                        if (destIdx < 0 && destZh.includes(dkw)) destIdx = stopIds.length - 1;
                    } else {
                        if (origIdx >= 0 && destIdx < 0 && destZh.includes(dkw)) destIdx = stopIds.length - 1;
                        if (destIdx >= 0 && origIdx < 0 && origZh.includes(okw)) origIdx = 0;
                        if (origIdx < 0 && destIdx < 0 && origZh.includes(okw) && destZh.includes(dkw)) { origIdx = 0; destIdx = stopIds.length - 1; }
                    }

                    if (origIdx >= 0 && destIdx >= 0 && origIdx < destIdx) {
                        const fare = (r.fares && r.fares[origIdx] != null) ? r.fares[origIdx] : (r.fares?.[0] ?? r.fare ?? null);
                        const origStopName = origIdx > 0 ? (stopList[stopIds[origIdx]]?.name?.zh || r.orig?.zh||'') : (r.orig?.zh||'');
                        const destStopName = destIdx < stopIds.length-1 ? (stopList[stopIds[destIdx]]?.name?.zh || r.dest?.zh||'') : (r.dest?.zh||'');
                        const actualBound = r.bound?.[co] || 'O';
                        const actualDir = actualBound === 'I' ? 'I' : 'O';
                        results.push({ co, route: r.route||rid.split('+')[0], orig: origStopName, dest: destStopName, fare, origIdx, destIdx, totalStops: stopIds.length, stopIds, r, dir: actualDir, bound: actualBound === 'I' ? 'inbound' : 'outbound' });
                    }
                });

                (this.state.gmbAllRoutes || []).forEach(r => {
                    const sn_orig = norm(r.orig||''), sn_dest = norm(r.dest||'');
                    const stopsStr = norm(r.stops_str||'');
                    if ((sn_orig.includes(okw) || stopsStr.includes(okw)) && (sn_dest.includes(dkw) || stopsStr.includes(dkw))) {
                        results.push({ co:'gmb', route: r.route, orig: r.orig||'', dest: r.dest||'', fare: null, origIdx:0, destIdx:1, totalStops:0, stopIds:[], r, dir:'O', bound:'outbound', gmb_routeId: r.gmb_routeId, gmb_routeSeq: r.gmb_routeSeq });
                    }
                });

                if (results.length === 0) {
                    resultsEl.innerHTML = `<div class="status-message" style="padding-top:40px;"><div style="font-size:40px;margin-bottom:16px;">😔</div>找不到「${originKw}」→「${destKw}」的直達路線</div>`;
                    return;
                }

                const order = ['kmb','ctb','nlb','gmb'];
                results.sort((a,b) => (order.indexOf(a.co)-order.indexOf(b.co)) || a.route.localeCompare(b.route));

                let html = `<div style="font-size:13px;color:#8e8e93;padding:10px 4px 6px;">找到 ${results.length} 條直達路線</div>`;
                results.forEach((res, i) => {
                    const fareHtml = res.fare ? `<span style="font-size:16px;font-weight:700;color:${fareColors[res.co]||'#3a3a3c'};">$${res.fare}</span>` : '';
                    const stopInfo = res.totalStops > 0 ? `共 ${res.totalStops} 站` : '';
                    const actionIcon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c7c7cc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`;
                    html += `<div class="result-item planner-route-card" style="cursor:pointer; height:auto; padding:6px 12px;"
                        data-idx="${i}" data-co="${res.co}" data-route="${res.route}"
                        data-dir="${res.dir}" data-bound="${res.bound}"
                        data-orig="${(res.r?.orig?.zh||res.orig).replace(/"/g,'')}"
                        data-dest="${(res.r?.dest?.zh||res.dest).replace(/"/g,'')}">
                        <div class="result-item-left">
                            <div class="route-badge ${bgClass[res.co]||'bg-kmb'}">${res.route}</div>
                            <div class="result-item-text" style="flex-direction:column; align-items:flex-start; gap:1px; white-space:normal;">
                                <div class="result-dest" style="white-space:nowrap;">往 ${res.dest}</div>
                                <div class="result-meta" style="white-space:nowrap;">由 ${res.orig} 開出 · ${CO_NAME[res.co]||res.co} ${stopInfo}</div>
                            </div>
                        </div>
                        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">${fareHtml}${actionIcon}</div>
                    </div>`;
                });
                resultsEl.innerHTML = html;
                this._plannerResults = results;

                resultsEl.querySelectorAll('.planner-route-card').forEach(el => {
                    el.addEventListener('click', async () => {
                        const i = parseInt(el.dataset.idx);
                        const res = this._plannerResults[i];
                        const co = el.dataset.co;
                        const dir = el.dataset.dir || 'O';
                        let gmbRouteId = res?.gmb_routeId || null;
                        let gmbRouteSeq = res?.gmb_routeSeq || null;

                        // If GMB routeId missing, find from gmbAllRoutes
                        if (co === 'gmb' && !gmbRouteId) {
                            if (this.state.gmbAllRoutes?.length) {
                                const match = this.state.gmbAllRoutes.find(g =>
                                    String(g.route) === String(el.dataset.route) &&
                                    (el.dataset.dest === '' || (g.dest||'').includes(el.dataset.dest.slice(0,4)))
                                ) || this.state.gmbAllRoutes.find(g => String(g.route) === String(el.dataset.route));
                                if (match) { gmbRouteId = match.gmb_routeId; gmbRouteSeq = match.gmb_routeSeq; }
                            } else {
                                // gmbAllRoutes not ready: fetch routeId from etagmb API directly
                                try {
                                    const regions = ['HKI','KLN','NT'];
                                    const destKw = (el.dataset.dest||'').slice(0,4);
                                    for (const region of regions) {
                                        const rd = await this.fetchJSON(`https://data.etagmb.gov.hk/route/${region}/${el.dataset.route}`);
                                        if (rd?.data?.length) {
                                            gmbRouteId = rd.data[0].route_id;
                                            const dirs = rd.data[0].directions || [];
                                            const matched = dirs.find(d => destKw && (d.dest_tc||'').includes(destKw)) || dirs[0];
                                            gmbRouteSeq = matched?.route_seq || 1;
                                            break;
                                        }
                                    }
                                } catch(e) {}
                            }
                        }
                        this.openMapModal({
                            operator: co, route: el.dataset.route,
                            orig: el.dataset.orig, dest: el.dataset.dest,
                            dir, bound: el.dataset.bound,
                            kmbdir: dir, ctbdir: dir, opName: co,
                            gmb_routeId: gmbRouteId,
                            gmb_routeSeq: gmbRouteSeq,
                            stops: res?.stopIds || [],
                        });
                    });
                });
            },

            

            

            debounceSearch() { clearTimeout(this.state.searchTimeout); this.state.searchTimeout = setTimeout(() => this.performSearch(), 400); },

            async performSearch() {
                const inputVal = document.getElementById('route-input').value.trim().toUpperCase();
                const resultsArea = document.getElementById('search-results');

                // Show DB status
                const dbStatus = document.getElementById('db-status');
                if (dbStatus) dbStatus.textContent = this.state.isDataReady ? `✅ ${Object.keys(this.state.routeList||{}).length} 條路線已就緒` : '⚠️ 未匯入資料庫（使用基本搜尋）';

                if (!inputVal) {
                    return resultsArea.innerHTML = `
                        <div class="status-message" style="padding-top: 40px;">
                            <div style="font-size: 40px; margin-bottom: 16px;">🔍</div>
                            輸入路線號碼或起訖點名稱<br>系統將為您顯示所有相關路線<br><br>
                            <span style="font-size:12px; color:#aaa;">*支援九巴、城巴、大嶼山巴士及專線小巴</span>
                        </div>
                    `;
                }
                
                resultsArea.innerHTML = '<div class="status-message">正在智慧搜尋中... ⏳</div>';

                // ── 如果已匯入 hkbus 資料庫，用高速本地搜尋 ──
                if (this.state.isDataReady && this.state.routeList) {
                    const keywords = inputVal.split(/\s+/);
                    const isMatch = (...args) => { const s = args.join(' ').toUpperCase(); return keywords.every(kw => s.includes(kw)); };
                    const CO_NAME  = { kmb:'九巴', ctb:'城巴', nlb:'大嶼山巴士', gmb:'專線小巴', lrtfeeder:'港鐵巴士', lightRail:'輕鐵', mtr:'港鐵', lrt:'輕鐵' };
                    const CO_ORDER = ['kmb','ctb','nlb','gmb','lrtfeeder','lightRail'];
                    let results = [];
                    Object.entries(this.state.routeList).forEach(([routeKey, r]) => {
                        if (!r || !r.co || !r.co.length) return;
                        if (r.co.includes('kmb') && r.serviceType && r.serviceType !== '1') return;
                        if (r.co.every(c => ['mtr','lrt','sunferry','fortuneferry','hkkf','nwff'].includes(c))) return; // 排除港鐵及渡輪；保留 lightRail/lrtfeeder
                        const origZh = r.orig?.zh || '', destZh = r.dest?.zh || '', routeNo = r.route || '';
                        let matched = isMatch(routeNo, origZh, destZh);
                        if (!matched && this.state.stopList && (keywords.join('').match(/[一-鿿]/g)||[]).length >= 2) {
                            matched = Object.values(r.stops || {}).flat().some(sid => isMatch(this.state.stopList[sid]?.name?.zh || ''));
                        }
                        if (!matched) return;
                        r.co.forEach(co => {
                            if (['mtr','lrt','sunferry','fortuneferry','hkkf','nwff'].includes(co)) return; // 排除港鐵及渡輪；保留 lightRail/lrtfeeder
                            // routeFareList: 每個方向係獨立 entry，bound 已係正確方向
                            const bnd = r.bound?.[co] || 'O';
                            const d = (bnd === 'I') ? 'I' : 'O';
                            results.push({
                                routeKey, operator: co, route: routeNo, dir: d,
                                orig: origZh,   // 直接用 entry 本身的 orig/dest，唔需要 swap
                                dest: destZh,
                                opName: CO_NAME[co] || co,
                                bound: d === 'I' ? 'inbound' : 'outbound',
                                stops: r.stops?.[co] || [],
                                nlbId: r.nlbId || null,
                                nlb_routeId: r.nlbId || null,
                                gmb_routeId: r.gtfsId ? parseInt(r.gtfsId) : null,
                                gmb_routeSeq: d === 'I' ? 2 : 1,
                                gmb_route: r.route,
                                gmb_dest: destZh,
                                serviceType: r.serviceType || '1'
                            });
                        });
                    });
                    const pq = keywords[0];
                    results.sort((a, b) => {
                        const ae = a.route === pq, be = b.route === pq;
                        if (ae && !be) return -1; if (!ae && be) return 1;
                        const ao = CO_ORDER.indexOf(a.operator), bo = CO_ORDER.indexOf(b.operator);
                        if (ao !== bo) return ao - bo;
                        return a.route.localeCompare(b.route, undefined, { numeric:true, sensitivity:'base' });
                    });
                    this.state.currentSearchRouteResults = results.slice(0, 150);
                    this.renderSearchResultsUI();
                    return;
                }

                // ── 未匯入資料庫：使用原本 API 搜尋 ──
                const keywords = inputVal.split(/\s+/); 

                try {
                    let routeResults = [];
                    const [kmbRoutes, ctbRoutes, nlbRoutes, kmbDict, ctbList] = await Promise.all([
                        this.getKMBRoutes(), this.getCTBRoutes(), this.getNLBRoutes(),
                        this.getKMBStops(), this.getCTBAllStops()
                    ]);
                    
                    const isMatch = (...args) => {
                        const searchString = args.join(' ').toUpperCase();
                        return keywords.every(kw => searchString.includes(kw));
                    };

                    // ========================================================
                    // 第一階段：傳統路線文字比對 (包含小巴所有的「途經站」 stops_str)
                    // ========================================================
                    
                    if (kmbRoutes) {
                        kmbRoutes.filter(r => isMatch(r.route, r.orig_tc, r.dest_tc)).forEach(r => {
                            routeResults.push({ operator: 'kmb', route: r.route, bound: r.bound === 'I' ? 'inbound' : 'outbound', dir: r.bound, orig: r.orig_tc, dest: r.dest_tc, opName: '九巴' });
                        });
                    }
                    if (ctbRoutes) {
                        ctbRoutes.filter(r => isMatch(r.route, r.orig_tc, r.dest_tc)).forEach(r => {
                            routeResults.push({ operator: 'ctb', route: r.route, bound: 'outbound', dir: 'O', orig: r.orig_tc, dest: r.dest_tc, opName: '城巴' });
                            routeResults.push({ operator: 'ctb', route: r.route, bound: 'inbound', dir: 'I', orig: r.dest_tc, dest: r.orig_tc, opName: '城巴' });
                        });
                    }
                    if (nlbRoutes) {
                        nlbRoutes.filter(r => isMatch(r.routeNo, r.orig_tc, r.dest_tc)).forEach(r => {
                            routeResults.push({ operator: 'nlb', route: r.routeNo, nlb_routeId: r.routeId, orig: r.orig_tc, dest: r.dest_tc, opName: '大嶼山巴士' });
                        });
                    }
                    // 小巴：不只比起訖點，還比對剛才下載的 `stops_str` (涵蓋所有途經站)！
                    if (this.state.gmbAllRoutes && this.state.gmbAllRoutes.length > 0) {
                        this.state.gmbAllRoutes.forEach(r => {
                            if (isMatch(String(r.route), r.orig, r.dest, r.stops_str || '')) {
                                let exists = routeResults.some(res => res.operator === 'gmb' && res.route === r.route && res.gmb_routeSeq === r.gmb_routeSeq);
                                if (!exists) routeResults.push({...r});
                            }
                        });
                    } else {
                        try {
                            const _allGmb = await this.fetchJSON('https://data.etagmb.gov.hk/route');
                            if (_allGmb?.data?.routes) {
                                const _matched = [];
                                for (const [_region, _list] of Object.entries(_allGmb.data.routes)) {
                                    for (const _code of _list) { if (isMatch(String(_code))) _matched.push({region: _region, code: String(_code)}); }
                                }
                                for (const _m of _matched) {
                                    try {
                                        const _rd = await this.fetchJSON(`https://data.etagmb.gov.hk/route/${_m.region}/${_m.code}`);
                                        if (_rd?.data?.length) {
                                            _rd.data.forEach(route => {
                                                route.directions?.forEach(dir => {
                                                    const _ex = routeResults.some(res => res.operator === 'gmb' && res.route === _m.code && res.gmb_routeSeq === dir.route_seq);
                                                    if (!_ex) routeResults.push({ operator: 'gmb', route: _m.code, gmb_routeId: route.route_id, gmb_routeSeq: dir.route_seq, orig: dir.orig_tc, dest: dir.dest_tc, opName: '專線小巴', destinations: dir.dest_tc, gmb_route: _m.code, gmb_dest: dir.dest_tc });
                                                });
                                            });
                                        }
                                    } catch(e) {}
                                }
                            }
                        } catch(e) {}
                    }

                    // ========================================================
                    // 第二階段：九巴與城巴逆向反查 (找出名稱吻合的車站，並抓出所有「途經」該站的巴士路線)
                    // ========================================================
                    
                    let matchedKmbStops = [];
                    let matchedCtbStops = [];

                    if (kmbDict && (keywords.join('').match(/[\u4e00-\u9fff]/g)||[]).length >= 2) {
                        Object.keys(kmbDict).forEach(stopId => {
                            if (isMatch(kmbDict[stopId].name)) matchedKmbStops.push(stopId);
                        });
                    }
                    if (ctbList && (keywords.join('').match(/[\u4e00-\u9fff]/g)||[]).length >= 2) {
                        ctbList.forEach(s => {
                            if (isMatch(s.name_tc)) matchedCtbStops.push(s.stop);
                        });
                    }

                    // 為了避免過度呼叫 API，限制最大查詢數量
                    matchedKmbStops = matchedKmbStops.slice(0, 15);
                    matchedCtbStops = matchedCtbStops.slice(0, 15);

                    if (matchedKmbStops.length > 0 || matchedCtbStops.length > 0) {
                        let discoveredRoutes = {};

                        const kmbPromises = matchedKmbStops.map(async stopId => {
                            try {
                                const res = await this.fetchJSON(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`);
                                if(res && res.data) {
                                    res.data.forEach(item => {
                                        if (item.service_type === 1) {
                                            let bound = item.dir === 'I' ? 'inbound' : 'outbound';
                                            let key = `kmb-${item.route}-${item.dir}`;
                                            if(!discoveredRoutes[key]) {
                                                discoveredRoutes[key] = { operator: 'kmb', route: item.route, bound: bound, dir: item.dir, orig: '途經該站', dest: item.dest_tc, opName: '九巴' };
                                            }
                                        }
                                    });
                                }
                            } catch(e) {}
                        });

                        const ctbPromises = matchedCtbStops.map(async stopId => {
                            try {
                                const res = await this.fetchJSON(`https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${stopId}`);
                                if(res && res.data) {
                                    res.data.forEach(item => {
                                        if (!(item.rmk_tc && item.rmk_tc.includes('九巴時段'))) {
                                            let bound = item.dir === 'I' ? 'inbound' : 'outbound';
                                            let key = `ctb-${item.route}-${item.dir}`;
                                            if(!discoveredRoutes[key]) {
                                                discoveredRoutes[key] = { operator: 'ctb', route: item.route, bound: bound, dir: item.dir, orig: '途經該站', dest: item.dest_tc, opName: '城巴' };
                                            }
                                        }
                                    });
                                }
                            } catch(e) {}
                        });

                        await Promise.all([...kmbPromises, ...ctbPromises]);

                        // 將逆向查出的路線合併到結果中，並補回真實的起點
                        Object.values(discoveredRoutes).forEach(dr => {
                            let exists = routeResults.some(r => r.operator === dr.operator && r.route === dr.route && r.dir === dr.dir);
                            if (!exists) {
                                if (dr.operator === 'kmb' && kmbRoutes) {
                                    let rData = kmbRoutes.find(r => r.route === dr.route && r.bound === dr.dir);
                                    if (rData) dr.orig = rData.orig_tc;
                                } else if (dr.operator === 'ctb' && ctbRoutes) {
                                    let rData = ctbRoutes.find(r => r.route === dr.route && r.dest_tc === dr.dest);
                                    if (rData) dr.orig = rData.orig_tc;
                                }
                                routeResults.push(dr);
                            }
                        });
                    }

                    // ========================================================
                    // 第三階段：統一智能排序與渲染
                    // ========================================================
                    
                    const primaryQuery = keywords[0];
                    // Deduplicate: same operator+route+direction only once
                    routeResults = routeResults.filter((item, idx, arr) =>
                        arr.findIndex(x => x.operator === item.operator && x.route === item.route && x.dest === item.dest) === idx
                    );
                    routeResults.sort((a, b) => {
                        const aExact = a.route === primaryQuery; const bExact = b.route === primaryQuery;
                        if (aExact && !bExact) return -1; if (!aExact && bExact) return 1;
                        return a.route.localeCompare(b.route, undefined, {numeric: true, sensitivity: 'base'});
                    });
                    
                    this.state.currentSearchRouteResults = routeResults.slice(0, 150); 
                    this.renderSearchResultsUI();
                    
                } catch (e) { resultsArea.innerHTML = '<div class="status-message">搜尋發生異常，請重試。</div>'; }
            },


            getFareColor(operator) {
                const op = (operator || '').toLowerCase();
                if (op === 'kmb') return '#ff3b30';
                if (op === 'ctb') return '#ff9500';
                if (op === 'nlb') return '#007aff';
                if (op === 'gmb') return '#34c759';
                return '#3a3a3c';
            },

            getFareColor(operator) {
                const op = (operator || '').toLowerCase();
                if (op === 'kmb') return '#ff3b30';
                if (op === 'ctb') return '#ff9500';
                if (op === 'nlb') return '#007aff';
                if (op === 'gmb') return '#34c759';
                return '#3a3a3c';
            },

            async selectRouteDirection(index) {
